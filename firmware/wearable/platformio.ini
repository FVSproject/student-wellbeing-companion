; Student Wellbeing Companion — hand-rest sensor firmware
;
; Board: ESP32 DevKitC-32 (WROOM, 38-pin)
; See firmware/wearable/README.md for wiring + flashing steps.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Larger BLE stack, smaller loop stack — plenty of headroom for the sensor
; libraries + the ESP32 BLE library which is chunky.
board_build.partitions = huge_app.csv
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1

lib_deps =
  sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2
  adafruit/Adafruit MLX90614 Library@^2.1.5
  ; Wire and BLE come with the ESP32 Arduino framework.
