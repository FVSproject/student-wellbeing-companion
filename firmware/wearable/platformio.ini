; Student Wellbeing Companion — hand-rest sensor firmware
;
; Board: Seeed Studio XIAO ESP32-S3 (11-pin, USB-C, on-board LiPo charger)
; See firmware/wearable/README.md for wiring + flashing steps.

[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Huge APP partition — the ESP32 BLE library is chunky and default is too tight.
board_build.partitions = huge_app.csv

build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
  ; XIAO ESP32-S3 has USB-C only — enable USB-CDC so Serial goes over USB.
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1

lib_deps =
  sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2
  adafruit/Adafruit MLX90614 Library@^2.1.5
  ; Wire and BLE come with the ESP32 Arduino framework.
